<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background Pure Black -->
  <rect width="512" height="512" rx="128" fill="#000000" />
  
  <!-- Outer Concentric Tactical Rings -->
  <circle cx="256" cy="256" r="236" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="218" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="12 16" />
  <circle cx="256" cy="256" r="196" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Tactical Crosshairs / Ticks -->
  <line x1="256" y1="12" x2="256" y2="34" stroke="#00F0FF" stroke-width="4" />
  <line x1="256" y1="478" x2="256" y2="500" stroke="#00F0FF" stroke-width="4" />
  <line x1="12" y1="256" x2="34" y2="256" stroke="#00F0FF" stroke-width="4" />
  <line x1="478" y1="256" x2="500" y2="256" stroke="#00F0FF" stroke-width="4" />

  <!-- Glowing Emblem Gradient -->
  <defs>
    <linearGradient id="neonGlow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized Geometric V Glyph -->
  <path d="M120 160 L220 380 L260 380 L330 220 L300 220 L242 340 L168 160 Z" fill="url(#neonGlow)" filter="url(#glowFilter)" />
  
  <!-- Stylized Slashed Ø / O Glyph -->
  <path d="M280 270 A 55 55 0 1 0 380 270 A 55 55 0 1 0 280 270 Z" stroke="url(#neonGlow)" stroke-width="14" fill="none" filter="url(#glowFilter)" />
  <!-- Diagonal Tactical Slash -->
  <line x1="270" y1="330" x2="390" y2="210" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" filter="url(#glowFilter)" />

  <!-- Wordmark Bottom -->
  <text x="256" y="440" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">
    VØID.AI
  </text>
</svg>
